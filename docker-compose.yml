name: esp32s3-led-blink

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    # The project root is mounted as /work so cargo build writes
    # target/ back to the host; espflash can then flash the ELF directly.
    volumes:
      - .:/work
      # Persist downloaded crates across runs (speeds up re-builds).
      # Docker initialises these from the pre-fetched image layers on
      # first creation, so crates are available without a fresh download.
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    working_dir: /work
    # Default: release build.
    # Override with:
    #   docker compose run --rm build cargo build          (debug)
    #   docker compose run --rm build cargo build --release (explicit release)
    command: cargo build --release

# Named volumes for cargo dependency cache.
# Initialised automatically from the image's pre-fetched registry layer.
volumes:
  cargo-registry:
  cargo-git:
